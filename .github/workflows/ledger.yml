name: ledger-check

on:
  push:
  pull_request:

env:
  SKILL: skill/wincreator

jobs:
  ledger-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # A verifier that was never itself attacked is an unverified claim:
      # the gate proves itself before it is allowed to grade anything.
      - name: Compile the executable artifacts
        run: python -m py_compile $SKILL/scripts/*.py

      - name: ledger_check self-test
        run: python $SKILL/scripts/ledger_check.py --self-test

      - name: wincreator (capture layer) self-test
        run: python $SKILL/scripts/wincreator.py --self-test

      - name: package_check self-test
        run: python $SKILL/scripts/package_check.py --self-test

      - name: Skill package conforms to the Agent Skills format
        run: python $SKILL/scripts/package_check.py $SKILL

      - name: Proof ledgers are clean
        run: |
          for ledger in PROOF_LEDGER.md PROOF_LEDGER-v2-install.md \
                        PROOF_LEDGER-evolution.md PROOF_LEDGER-v3-proof-capture.md; do
            python $SKILL/scripts/ledger_check.py "$ledger"
          done

      - name: Attestations match their captured artifacts
        run: |
          python $SKILL/scripts/wincreator.py verify \
            --ledger PROOF_LEDGER-v3-proof-capture.md

      - name: Release package builds and is checksummed
        run: ./tools/build_package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wincreator-skill-package
          path: |
            dist/wincreator.skill
            dist/wincreator.skill.sha256

      - name: Retro-loop is alive
        run: python $SKILL/scripts/ledger_check.py --catches $SKILL/SKEPTIC_CATCHES.md
