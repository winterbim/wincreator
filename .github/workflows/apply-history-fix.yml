name: apply-history-fix

on:
  push:
    branches:
      - fix/longitudinal-proof-history

permissions:
  contents: write
  checks: read
  actions: read

jobs:
  publish-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d82ef9c10d9d770e45a721872801ed5918113e16
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bind tag, version, master, and green CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=v3.0.2
          tag_commit="$(git rev-parse "${tag}^{commit}")"
          test "$tag_commit" = "d82ef9c10d9d770e45a721872801ed5918113e16"
          test "$(tr -d '\r\n' < skill/wincreator/VERSION)" = "3.0.2"
          git fetch origin master
          git merge-base --is-ancestor "$tag_commit" origin/master
          gh api "repos/${GITHUB_REPOSITORY}/commits/${tag_commit}/check-runs" > "$RUNNER_TEMP/check-runs.json"
          python tools/release_policy.py \
            --expected-tag "$tag" \
            --workflow-sha "$tag_commit" \
            --tag-commit "$tag_commit" \
            --default-branch-head "$(git rev-parse origin/master)" \
            --default-branch-contains-tag true \
            --package-version "$(tr -d '\r\n' < skill/wincreator/VERSION)" \
            --required-check ci-success \
            --required-check-app github-actions \
            --check-runs-json "$RUNNER_TEMP/check-runs.json"
      - name: Re-run source release gates
        run: |
          python -m pip install --disable-pip-version-check pytest==8.3.5 jsonschema==4.23.0
          python tools/run_release_gate.py
      - name: Capture clean-tree release attestation
        run: |
          cp PROOF_LEDGER-v3-proof-capture.md "$RUNNER_TEMP/release-ledger.md"
          python skill/wincreator/scripts/wincreator.py prove V3-07 \
            --ledger "$RUNNER_TEMP/release-ledger.md" \
            --attest-dir "$RUNNER_TEMP/attestations" \
            --tier regulated \
            --builder github-actions-builder \
            --file dist/skill.zip \
            --file dist/skill.zip.sha256 \
            --file dist/wincreator.skill \
            --file dist/wincreator.skill.sha256 \
            -- python tools/run_release_gate.py
          python skill/wincreator/scripts/wincreator.py review V3-07 \
            --ledger "$RUNNER_TEMP/release-ledger.md" \
            --attest-dir "$RUNNER_TEMP/attestations" \
            --verdict evidenced \
            --reviewer github-actions-skeptic \
            --automatic
          python skill/wincreator/scripts/wincreator.py verify \
            --attest-dir "$RUNNER_TEMP/attestations" \
            --ledger "$RUNNER_TEMP/release-ledger.md"
          mkdir -p "$RUNNER_TEMP/release-bundle/dist"
          cp -R "$RUNNER_TEMP/attestations" "$RUNNER_TEMP/release-bundle/attestations"
          cp "$RUNNER_TEMP/release-ledger.md" "$RUNNER_TEMP/release-bundle/release-ledger.md"
          cp dist/skill.zip "$RUNNER_TEMP/release-bundle/dist/skill.zip"
          cp dist/skill.zip.sha256 "$RUNNER_TEMP/release-bundle/dist/skill.zip.sha256"
          cp dist/wincreator.skill "$RUNNER_TEMP/release-bundle/dist/wincreator.skill"
          cp dist/wincreator.skill.sha256 "$RUNNER_TEMP/release-bundle/dist/wincreator.skill.sha256"
          (cd "$RUNNER_TEMP/release-bundle" && zip -qr "$GITHUB_WORKSPACE/dist/wincreator-attestations.zip" attestations release-ledger.md dist)
          (cd dist && sha256sum wincreator-attestations.zip > wincreator-attestations.zip.sha256)
      - name: Publish v3.0.2 assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=v3.0.2
          assets=(
            dist/skill.zip
            dist/skill.zip.sha256
            dist/wincreator.skill
            dist/wincreator.skill.sha256
            dist/wincreator-attestations.zip
            dist/wincreator-attestations.zip.sha256
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --verify-tag --title "WinCreator 3.0.2" --notes-file RELEASE_NOTES.md --draft=false --prerelease=false --latest
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --title "WinCreator 3.0.2" --notes-file RELEASE_NOTES.md --latest
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" = "$tag"
          python tools/deprecate_old_releases.py --repository "$GITHUB_REPOSITORY" --current-tag "$tag"
