name: apply-current-evidence-fix2

on:
  push:
    branches:
      - fix/longitudinal-proof-history

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/longitudinal-proof-history
      - name: Patch verifier current-chain selection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('skill/wincreator/scripts/wincreator.py')
          source = path.read_text(encoding='utf-8')
          start_marker = '    # Historical proof chains remain integrity-checked above. Only the\n'
          end_marker = '    return checked, problems\n\n\n# ---------------------------------------------------------------------- CLI'
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = '''    # Historical proof chains remain integrity-checked above. The ledger's
    # current evidence is authoritative about which valid chain is current.
    # This avoids guessing from timestamps when proof executions overlap.
    entries_by_claim = {}
    for entry in verified:
        entries_by_claim.setdefault(entry["claim_id"], []).append(entry)

    for claim_id, entries in entries_by_claim.items():
        current = entries[0]["current"]
        matches = [
            entry for entry in entries
            if current["evidence"].startswith(entry["expected_evidence"])
        ]
        if len(matches) != 1:
            problems.append(
                f"{ledger_path}: row {claim_id} evidence does not uniquely identify "
                "one valid capture/review chain"
            )
            continue
        entry = matches[0]
        expected_status = entry["expected_status"]
        if current["status"] != expected_status:
            problems.append(
                f"{ledger_path}: row {claim_id} status {current['status']} does not match "
                f"current capture/review status {expected_status}"
            )
        if expected_status != "EVIDENCED":
            problems.append(
                f"{ledger_path}: row {claim_id} is {expected_status}; "
                "current proof integrity is valid but the claim is not evidenced"
            )
'''
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY
          python -m py_compile skill/wincreator/scripts/wincreator.py
          python -m pip install -q pytest
          python -m pytest -q tests/test_longitudinal_history.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skill/wincreator/scripts/wincreator.py
          git commit -m "fix: bind current proof chain to ledger evidence"
          git push origin HEAD:fix/longitudinal-proof-history
