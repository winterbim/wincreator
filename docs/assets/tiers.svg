<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">WinCreator tiers</title>
  <desc id="desc">Lite, Standard, and Regulated tiers with proportional ceremony.</desc>
  <defs>
    <style>
      .h { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #0f172a; }
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #0f172a; }
      .s { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .bar1 { fill: #0f766e; }
      .bar2 { fill: #0e7490; }
      .bar3 { fill: #1e3a5f; }
    </style>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>
  <text x="32" y="36" class="h">Ceremony proportional to stakes</text>

  <!-- Lite -->
  <rect x="32" y="60" width="280" height="200" rx="12" class="card"/>
  <rect x="32" y="60" width="280" height="8" rx="4" class="bar1"/>
  <text x="52" y="100" class="t">Lite</text>
  <text x="52" y="124" class="s">One claim, one gate</text>
  <text x="52" y="144" class="s">Result checkable right now</text>
  <text x="52" y="164" class="s">Optional auto-approve</text>
  <text x="52" y="196" class="s">Default for low-stakes work</text>
  <text x="52" y="228" class="s">Announce → execute → done</text>

  <!-- Standard -->
  <rect x="340" y="60" width="280" height="200" rx="12" class="card"/>
  <rect x="340" y="60" width="280" height="8" rx="4" class="bar2"/>
  <text x="360" y="100" class="t">Standard</text>
  <text x="360" y="124" class="s">Multi-step, costly if wrong</text>
  <text x="360" y="144" class="s">Loop Panel + ledger</text>
  <text x="360" y="164" class="s">Capture then separate review</text>
  <text x="360" y="196" class="s">Critical claims reviewed</text>
  <text x="360" y="228" class="s">ledger_check.py as final gate</text>

  <!-- Regulated -->
  <rect x="648" y="60" width="280" height="200" rx="12" class="card"/>
  <rect x="648" y="60" width="280" height="8" rx="4" class="bar3"/>
  <text x="668" y="100" class="t">Regulated</text>
  <text x="668" y="124" class="s">Audit / contract / safety</text>
  <text x="668" y="144" class="s">Clean Git tree through gate</text>
  <text x="668" y="164" class="s">Distinct Builder / reviewer</text>
  <text x="668" y="196" class="s">Attestations retained</text>
  <text x="668" y="228" class="s">Human sign-off outside CLI</text>
</svg>
